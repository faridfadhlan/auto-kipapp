[project]
name = "auto-kipapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "farid.fadhlan", email = "farid.fadhlan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "browser-use>=0.13.10",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.2",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.scripts]
auto-kipapp = "auto_kipapp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
